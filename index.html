<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rupesh &amp; Pallavi — Engagement Ceremony | 22 Nov 2026</title>
<style>
  :root{--paper:#fff;--muted:#f4f5f8;--ink:#111116;--subtle:#71717a;--line:#e4e4e7}
  *{box-sizing:border-box}html,body{{margin:0;padding:0;height:100%}}
  body{{font-family:Inter,"inter fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--muted)}}
  .app{{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--muted)}}
  header{{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;flex:none;padding:0 20px;background:var(--paper);border-bottom:1px solid var(--line)}}
  .title p{{margin:0;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
  .controls{{display:flex;align-items:center;gap:8px}}
  .icon-btn{{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--subtle);cursor:pointer}}
  .segment{{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px}}
  .segment button{{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--subtle);font:inherit;font-size:12px;cursor:pointer}}
  .segment button[aria-pressed="true"]{{background:var(--ink);color:var(--paper)}}
  .stage{{position:relative;flex:1;min-height:0;background:var(--paper);overflow:auto}}
  .stage iframe{{display:block;border:0;width:100%;min-width:100%;height:100%;background:var(--paper)}}
  .stage.mobile iframe{{width:390px;min-width:390px;height:844px;margin:0 auto}}
  }
  }
  }
  @media(max-width:767px){{.segment{{display:none}}}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><p>Rupesh &amp; Pallavi — Engagement preview</p></div>
    <div class="controls">
      <button class="icon-btn" id="reload" aria-label="Reload preview">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
      </button>
      <div class="segment" role="group" aria-label="Preview device">
        <button id="desktopBtn" aria-pressed="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg><span>Desktop</span></button>
        <button id="mobileBtn" aria-pressed="false"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75"><rect width="14" height="20" x="5" y="2" rx="2"></rect><path d="M12 18h.01"></path></svg><span>Mobile</span></button>
      </div>
    </div>
  </header>
  <div class="stage" id="stage">
    <iframe id="preview" src="render.html" title="Rupesh &amp; Pallavi — Engagement preview"></iframe>
    
  </div>
</div>
<script>
  const stage=document.getElementById('stage'),frame=document.getElementById('preview'),desktop=document.getElementById('desktopBtn'),mobile=document.getElementById('mobileBtn');
  document.getElementById('reload').addEventListener('click',()=>{{frame.src='render.html?'+Date.now()}});
  desktop.addEventListener('click',()=>{{desktop.setAttribute('aria-pressed','true');mobile.setAttribute('aria-pressed','false');stage.classList.remove('mobile')}});
  mobile.addEventListener('click',()=>{{mobile.setAttribute('aria-pressed','true');desktop.setAttribute('aria-pressed','false');stage.classList.add('mobile')}});
</script>
</body>
</html>
